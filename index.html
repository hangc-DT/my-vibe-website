<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation Generator - Local Font</title>
    <style>
        /* ==========================================================
           LOAD LOCAL TTF FONT 
           ========================================================== */
        @font-face {
            font-family: 'MyLocalFont';
            /* Make sure the filename below matches your actual .ttf file exactly */
            src: url('my-custom-font.otf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg-workspace: #0f172a;
            --panel-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
            
            /* Apply your local font to both headers and data layout */
            --font-display: 'MyLocalFont', sans-serif;
            --font-data: 'MyLocalFont', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-workspace);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-data);
        }

        /* Input Sidebar Area */
        .input-panel {
            width: 35%;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            height: 100%;
        }

        /* Preview Canvas Area */
        .preview-panel {
            width: 65%;
            padding: 2rem;
            overflow-y: auto;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #334155;
        }

        h2 {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 700;
            margin: 1.5rem 0 0.75rem 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        h2:first-of-type { margin-top: 0; }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .form-control {
            display: flex;
            flex-direction: column;
        }

        label {
            font-family: var(--font-display);
            font-weight: 500;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
        }

        input, textarea {
            font-family: var(--font-data);
            background: #0f172a;
            border: 1px solid var(--border);
            color: #fff;
            padding: 0.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        input:focus, textarea:focus {
            border-color: var(--accent);
            outline: none;
        }

        .items-table-input {
            width: 100%;
            border-collapse: collapse;
        }

        .items-table-input th {
            font-family: var(--font-display);
            text-align: left;
            font-size: 0.7rem;
            color: #94a3b8;
            padding-bottom: 0.25rem;
        }

        .items-table-input input {
            width: 100%;
            padding: 0.35rem;
            font-size: 0.85rem;
        }

        .btn-primary {
            font-family: var(--font-display);
            width: 100%;
            background: #10b981;
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: background 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-primary:hover { background: #059669; }

        /* ==========================================================
           THE A4 PRINT SHEET TARGET 
           ========================================================== */
        .a4-page {
            width: 794px;  
            height: 1123px; 
            background-image: url('quotation-form.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-color: white;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        /* Text Placement Layer Styles */
        .meta-text {
            position: absolute;
            font-family: var(--font-data);
            font-size: 13px;
            color: #000;
        }

        /* ----------------------------------------------------------
           ALIGNMENT SETTINGS: Tweak these percentages to shift text
           ---------------------------------------------------------- */
        #out-date        { top: 15.6%; left: 77.0%; }
        #out-quote       { top: 17.9%; left: 77.0%; }
        #out-customer-id { top: 20.1%; left: 77.0%; }
        #out-valid       { top: 22.3%; left: 77.0%; }

        #out-c-company   { top: 27.0%; left: 21.0%; }
        #out-c-name      { top: 28.9%; left: 16.0%; }
        #out-c-address   { top: 30.9%; left: 17.5%; }
        #out-c-email     { top: 32.8%; left: 16.0%; }
        #out-c-phone     { top: 34.7%; left: 16.5%; }

        /* Rows Setup */
        .render-row {
            position: absolute;
            display: flex;
            width: 86%;
            left: 7%;
            font-family: var(--font-data);
            font-size: 12px;
            color: #000;
        }

        .col-item   { width: 10.5%; text-align: center; }
        .col-desc   { width: 31.5%; text-align: left; padding-left: 5px; }
        .col-qty    { width: 12.5%; text-align: center; }
        .col-price  { width: 12.5%; text-align: right; }
        .col-disc   { width: 13.5%; text-align: center; }
        .col-total  { width: 19.5%; text-align: right; }

        /* Vertical Heights for Rows 1 to 8 */
        #row-0 { top: 39.3%; }
        #row-1 { top: 41.8%; }
        #row-2 { top: 44.3%; }
        #row-3 { top: 46.8%; }
        #row-4 { top: 49.3%; }
        #row-5 { top: 51.8%; }
        #row-6 { top: 54.3%; }
        #row-7 { top: 56.8%; }

        /* Calculation Block Positions */
        .summary-block {
            position: absolute;
            left: 77.0%;
            width: 16%;
            text-align: right;
            font-family: var(--font-data);
            font-size: 13px;
            color: #000;
        }
        #out-subtotal { top: 60.1%; }
        #out-tax      { top: 62.6%; }
        #out-taxrate  { top: 65.0%; }
        #out-shipping { top: 67.4%; }
        #out-balance  { top: 69.9%; }

        #out-notes {
            position: absolute;
            top: 62.8%;
            left: 10.5%;
            width: 55%;
            height: 8%;
            font-family: var(--font-data);
            font-size: 12px;
            color: #000;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        /* ==========================================================
           BROWSER PRINT CORE ENGINE SPECIFICATIONS 
           ========================================================== */
        @media print {
            body {
                background: none;
                color: #000;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .input-panel {
                display: none !important; 
            }
            .preview-panel {
                width: 100% !important;
                padding: 0 !important;
                background: none !important;
            }
            .a4-page {
                box-shadow: none !important;
                position: absolute;
                top: 0;
                left: 0;
                width: 100% !important;
                height: 100% !important;
                page-break-after: avoid;
                page-break-before: avoid;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            @page {
                size: A4 portrait;
                margin: 0; 
            }
        }
    </style>
</head>
<body>

    <div class="input-panel">
        <h2 style="margin-top: 0;">MetaData</h2>
        <div class="form-group">
            <div class="form-control"><label>Date</label><input type="text" id="in-date" value="2026-05-22"></div>
            <div class="form-control"><label>Quote #</label><input type="text" id="in-quote" value="QT-001"></div>
            <div class="form-control"><label>Customer ID</label><input type="text" id="in-customer-id" value="CUST-99"></div>
            <div class="form-control"><label>Valid Until</label><input type="text" id="in-valid" value="30 Days"></div>
        </div>
        
        <h2>Customer Details</h2>
        <div class="form-group" style="grid-template-columns: 1fr;">
            <div class="form-control"><label>Company Name</label><input type="text" id="in-c-company" value="Acme Corp"></div>
            <div class="form-control"><label>Contact Name</label><input type="text" id="in-c-name" value="John Doe"></div>
            <div class="form-control"><label>Address</label><input type="text" id="in-c-address" value="123 Science Park Rd"></div>
            <div class="form-control"><label>E-mail</label><input type="text" id="in-c-email" value="john@acme.com"></div>
            <div class="form-control"><label>Phone</label><input type="text" id="in-c-phone" value="+1 555-0199"></div>
        </div>

        <h2>Items Table (Max 8)</h2>
        <table class="items-table-input">
            <thead>
                <tr>
                    <th style="width: 15%">Item</th>
                    <th style="width: 45%">Description</th>
                    <th style="width: 10%">Qty</th>
                    <th style="width: 15%">Price</th>
                    <th style="width: 15%">Disc%</th>
                </tr>
            </thead>
            <tbody id="input-rows-container"></tbody>
        </table>

        <h2>Financial Adjustments</h2>
        <div class="form-group">
            <div class="form-control"><label>Tax Rate (%)</label><input type="number" id="in-taxrate" value="5" step="0.01"></div>
            <div class="form-control"><label>Shipping ($)</label><input type="number" id="in-shipping" value="15.00" step="0.01"></div>
        </div>
        <div class="form-control">
            <label>Notes / Special Comments</label>
            <textarea id="in-notes" rows="2">Thank you for your business!</textarea>
        </div>

        <button class="btn-primary" onclick="window.print()">Open Print / Save PDF</button>
    </div>

    <div class="preview-panel">
        <div class="a4-page">
            <div class="meta-text" id="out-date"></div>
            <div class="meta-text" id="out-quote"></div>
            <div class="meta-text" id="out-customer-id"></div>
            <div class="meta-text" id="out-valid"></div>

            <div class="meta-text" id="out-c-company"></div>
            <div class="meta-text" id="out-c-name"></div>
            <div class="meta-text" id="out-c-address"></div>
            <div class="meta-text" id="out-c-email"></div>
            <div class="meta-text" id="out-c-phone"></div>

            <div id="output-rows-container"></div>

            <div class="summary-block" id="out-subtotal"></div>
            <div class="summary-block" id="out-tax"></div>
            <div class="summary-block" id="out-taxrate"></div>
            <div class="summary-block" id="out-shipping"></div>
            <div class="summary-block" id="out-balance"></div>

            <div id="out-notes"></div>
        </div>
    </div>

    <script>
        const MAX_ROWS = 8;
        const inputContainer = document.getElementById('input-rows-container');
        const outputContainer = document.getElementById('output-rows-container');

        // Setup DOM templates
        let rowsHtml = '';
        let outputHtml = '';
        for(let i=0; i<MAX_ROWS; i++) {
            rowsHtml += `
                <tr>
                    <td><input type="text" class="tr-item" data-idx="${i}" value="${i===0?'01':''}"></td>
                    <td><input type="text" class="tr-desc" data-idx="${i}" value="${i===0?'Engineering Design Work':''}"></td>
                    <td><input type="number" class="tr-qty" data-idx="${i}" value="${i===0?'5':'0'}"></td>
                    <td><input type="number" class="tr-price" data-idx="${i}" value="${i===0?'120.00':'0.00'}" step="0.01"></td>
                    <td><input type="number" class="tr-disc" data-idx="${i}" value="0"></td>
                </tr>`;
            outputHtml += `
                <div class="render-row" id="row-${i}">
                    <div class="col-item" id="out-item-${i}"></div>
                    <div class="col-desc" id="out-desc-${i}"></div>
                    <div class="col-qty" id="out-qty-${i}"></div>
                    <div class="col-price" id="out-price-${i}"></div>
                    <div class="col-disc" id="out-disc-${i}"></div>
                    <div class="col-total" id="out-total-${i}"></div>
                </div>`;
        }
        inputContainer.innerHTML = rowsHtml;
        outputContainer.innerHTML = outputHtml;

        const fields = ['date', 'quote', 'customer-id', 'valid', 'c-company', 'c-name', 'c-address', 'c-email', 'c-phone', 'notes'];
        fields.forEach(field => {
            const inp = document.getElementById(`in-${field}`);
            const out = document.getElementById(`out-${field}`);
            inp.addEventListener('input', () => out.textContent = inp.value);
            out.textContent = inp.value;
        });

        document.querySelectorAll('.tr-item, .tr-desc, .tr-qty, .tr-price, .tr-disc, #in-taxrate, #in-shipping')
            .forEach(el => el.addEventListener('input', runCalculations));

        function runCalculations() {
            let subtotal = 0;
            for(let i=0; i<MAX_ROWS; i++) {
                const item = document.querySelector(`.tr-item[data-idx="${i}"]`).value;
                const desc = document.querySelector(`.tr-desc[data-idx="${i}"]`).value;
                const qty = parseFloat(document.querySelector(`.tr-qty[data-idx="${i}"]`).value) || 0;
                const price = parseFloat(document.querySelector(`.tr-price[data-idx="${i}"]`).value) || 0;
                const disc = parseFloat(document.querySelector(`.tr-disc[data-idx="${i}"]`).value) || 0;

                const total = (qty * price) * (1 - disc/100);
                subtotal += total;

                document.getElementById(`out-item-${i}`).textContent = item;
                document.getElementById(`out-desc-${i}`).textContent = desc;
                document.getElementById(`out-qty-${i}`).textContent = qty > 0 ? qty : '';
                document.getElementById(`out-price-${i}`).textContent = price > 0 ? price.toFixed(2) : '';
                document.getElementById(`out-disc-${i}`).textContent = disc > 0 ? `${disc}%` : '';
                document.getElementById(`out-total-${i}`).textContent = total > 0 ? total.toFixed(2) : '';
            }

            const taxRate = parseFloat(document.getElementById('in-taxrate').value) || 0;
            const shipping = parseFloat(document.getElementById('in-shipping').value) || 0;
            const tax = subtotal * (taxRate / 100);
            const balance = subtotal + tax + shipping;

            document.getElementById('out-subtotal').textContent = subtotal > 0 ? `$${subtotal.toFixed(2)}` : '';
            document.getElementById('out-taxrate').textContent = taxRate > 0 ? `${taxRate}%` : '0%';
            document.getElementById('out-tax').textContent = tax > 0 ? `$${tax.toFixed(2)}` : '';
            document.getElementById('out-shipping').textContent = shipping > 0 ? `$${shipping.toFixed(2)}` : '';
            document.getElementById('out-balance').textContent = balance > 0 ? `$${balance.toFixed(2)}` : '';
        }

        runCalculations();
    </script>
</body>
</html>

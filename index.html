<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1CM Creative Invoice Generator</title>
    <style>
        /* ==========================================================
           LOAD LOCAL TTF FONT 
           ========================================================== */
        @font-face {
            font-family: 'MyLocalFont';
            src: url('my-custom-font.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg-workspace: #171717; 
            --panel-bg: #000000;      
            --accent: #ffea00;        
            --text: #ffffff;
            --text-muted: #a3a3a3;
            --border: #262626;
            --input-bg: #141414;
            --input-border: #404040;
            
            --font-main: 'MyLocalFont', Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-workspace);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-main);
        }

        /* ==========================================================
           BRANDED INPUT SIDEBAR DESIGN
           ========================================================== */
        .input-panel {
            width: 38%;
            background-color: var(--panel-bg);
            border-right: 2px solid #262626;
            padding: 2rem 1.5rem;
            overflow-y: auto;
            height: 100%;
        }

        h2 {
            font-size: 0.9rem;
            font-weight: 800;
            margin: 2rem 0 1rem 0;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-left: 4px solid var(--accent); 
            padding-left: 0.6rem;
        }
        h2:first-of-type { margin-top: 0; }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-control {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, textarea {
            font-family: var(--font-main);
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: #fff;
            padding: 0.6rem;
            border-radius: 0px; 
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        input:focus, textarea:focus {
            border-color: var(--accent);
            background: #1a1a1a;
            outline: none;
            box-shadow: 0 0 5px rgba(255, 234, 0, 0.2);
        }

        .items-table-input {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0.5rem;
        }

        .items-table-input th {
            text-align: left;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            padding-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .items-table-input td {
            padding: 0.4rem 0;
            border-bottom: 1px solid #1f1f1f;
            vertical-align: top;
        }

        .items-table-input input {
            width: 100%;
            padding: 0.5rem;
            font-size: 0.85rem;
        }

        .subdesc-input {
            margin-top: 0.35rem; 
            border-color: #262626; 
            font-size: 0.8rem; 
            color: #a3a3a3;
        }

        .btn-primary {
            font-family: var(--font-main);
            width: 100%;
            background: var(--accent);
            color: #000;
            padding: 1.1rem;
            border: none;
            border-radius: 0px; 
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s ease;
        }

        .btn-primary:hover { 
            background: #ffffff;
            color: #000;
        }

        .preview-panel {
            width: 62%;
            padding: 2rem;
            overflow-y: auto;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #262626; 
        }

        /* ==========================================================
           THE 1CM INVOICE PIXEL-PERFECT SHEET TARGET
           ========================================================== */
        .a4-page {
            width: 794px;  
            height: 1123px; 
            /* MODIFICATION 1: Changed background graphic format to PNG */
            background-image: url('1cm_invoice.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-color: white;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }

        .meta-text {
            position: absolute;
            font-family: var(--font-main);
            font-size: 17px;
            color: #1a1a1a;
            font-weight: bold;
        }

 /* FIXED: Added position: absolute explicitly to the #out-to container rule below */
        #out-to          { position: absolute; top: 21.0%; left: 6.5%; width: 30%; height: 12%; white-space: pre-wrap; line-height: 1.4; color: #000; font-weight: bold; font-size: 14px; }
        #out-date        { top: 26.7%; left: 38.0%; }
        #out-no          { top: 26.7%; left: 71.0%; }
        #out-date-issued { top: 31.5%; left: 38.0%; }
        #out-total-due   { top: 31.5%; left: 71.0%; font-size: 17px; color: #000; } 

        .render-row {
            position: absolute;
            display: flex;
            align-items: flex-start;
            width: 87.0%;
            left: 6.5%;
            font-family: var(--font-main);
            font-size: 13px;
            color: #222;
        }

        .col-desc   { width: 37%; text-align: left; padding-left: 5px; display: flex; flex-direction: column; }
        .col-price  { width: 14.5%; text-align: right; padding-right: 15px; margin-top: 2px; }
        .col-qty    { width: 29.5%; text-align: center; margin-top: 2px; }
        .col-total  { width: 11.5%; text-align: right; padding-right: 5px; font-weight: bold; margin-top: 2px; }

        /* MODIFICATION 3: Gray & smaller styling properties for item sub-descriptions */
        .out-title-main {
            font-weight: bold;
            color: #1a1a1a;
        }
        
        .out-title-sub {
            font-size: 11px;
            color: #737373; /* Smooth gray tone */
            font-weight: normal;
            margin-top: 1px;
            line-height: 1.2;
        }

        /* Row heights variables */
        #row-0 { top: 42.5%; }
        #row-1 { top: 45.7%; }
        #row-2 { top: 48.9%; }
        #row-3 { top: 52.1%; }
        #row-4 { top: 55.3%; }
        #row-5 { top: 58.5%; }
        #row-6 { top: 61.7%; }
        #row-7 { top: 64.9%; }

        /* Grand Total field config */
        .summary-block {
            position: absolute;
            left: 74.5%;
            width: 13.5%;
            text-align: right;
            font-family: var(--font-main);
            color: #000;
            font-weight: bold;
        }
        #out-grand    { top: 80.3%; font-size: 20px; }

        #out-payment {
            position: absolute;
            top: 85.5%;
            left: 6.5%;
            width: 45%;
            height: 8%;
            font-family: var(--font-main);
            font-size: 12px;
            color: #333;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        /* ==========================================================
           BROWSER PRINT CORE ENGINE SPECIFICATIONS 
           ========================================================== */
        @media print {
            body {
                background: none;
                color: #000;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .input-panel {
                display: none !important; 
            }
            .preview-panel {
                width: 100% !important;
                padding: 0 !important;
                background: none !important;
            }
            .a4-page {
                box-shadow: none !important;
                position: absolute;
                top: 0;
                left: 0;
                width: 100% !important;
                height: 100% !important;
                page-break-after: avoid;
                page-break-before: avoid;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            @page {
                size: A4 portrait;
                margin: 0; 
            }
        }
    </style>
</head>
<body>

    <div class="input-panel">
        <h2 style="margin-top: 0;">Invoice Metadata</h2>
        <div class="form-group">
            <div class="form-control"><label>Date</label><input type="text" id="in-date" value="2026-05-27"></div>
            <div class="form-control"><label>Invoice No (NO:)</label><input type="text" id="in-no" value="INV-2026-001"></div>
        </div>
        <div class="form-group">
            <div class="form-control"><label>Date Issued</label><input type="text" id="in-date-issued" value="2026-05-27"></div>
            <div class="form-control"><label>Total Due</label><input type="text" id="in-total-due" readonly style="opacity: 0.5; cursor: not-allowed;"></div>
        </div>
        
        <h2>Client Details (To)</h2>
        <div class="form-control" style="margin-bottom: 0.75rem;">
            <label>Billing Destination Info</label>
            <textarea id="in-to" rows="4" placeholder="Client Info...">Client Corporation Ltd.&#10;Attn: Project Manager&#10;123 Cyberport Road, Hong Kong</textarea>
        </div>

        <h2>Line Items (Max 8 Rows)</h2>
        <table class="items-table-input">
            <thead>
                <tr>
                    <th style="width: 55%">Description & Sub-Text</th>
                    <th style="width: 25%">Price ($)</th>
                    <th style="width: 20%">Qty</th>
                </tr>
            </thead>
            <tbody id="input-rows-container"></tbody>
        </table>

        <h2>Footer & Payment Information</h2>
        <div class="form-control">
            <label>Payment Info Details</label>
            <textarea id="in-payment" rows="3">Bank: Creative Tech Bank&#10;Account No: 123-456789-001&#10;FPS ID: 97627811</textarea>
        </div>

        <button class="btn-primary" onclick="window.print()">Print / Export Invoice PDF</button>
    </div>

    <div class="preview-panel">
        <div class="a4-page">
            <div id="out-to"></div>
            <div class="meta-text" id="out-date"></div>
            <div class="meta-text" id="out-no"></div>
            <div class="meta-text" id="out-date-issued"></div>
            <div class="meta-text" id="out-total-due"></div>

            <div id="output-rows-container"></div>

            <div class="summary-block" id="out-grand"></div>

            <div id="out-payment"></div>
        </div>
    </div>

    <script>
        const MAX_ROWS = 8;
        const inputContainer = document.getElementById('input-rows-container');
        const outputContainer = document.getElementById('output-rows-container');

        // Dynamic generation algorithm initialization 
        let rowsHtml = '';
        let outputHtml = '';
        for(let i=0; i<MAX_ROWS; i++) {
            rowsHtml += `
                <tr>
                    <td>
                        <input type="text" class="tr-desc" data-idx="${i}" value="${i===0?'Media Production Services':''}" placeholder="Main Title">
                        <input type="text" class="tr-subdesc subdesc-input" data-idx="${i}" value="${i===0?'Color grading and 4K multi-cam assembly rendering':''}" placeholder="Gray Sub-description">
                    </td>
                    <td><input type="number" class="tr-price" data-idx="${i}" value="${i===0?'8500.00':'0.00'}" step="0.01"></td>
                    <td><input type="number" class="tr-qty" data-idx="${i}" value="${i===0?'1':'0'}"></td>
                </tr>`;
            outputHtml += `
                <div class="render-row" id="row-${i}">
                    <div class="col-desc">
                        <div class="out-title-main" id="out-desc-${i}"></div>
                        <div class="out-title-sub" id="out-subdesc-${i}"></div>
                    </div>
                    <div class="col-price" id="out-price-${i}"></div>
                    <div class="col-qty" id="out-qty-${i}"></div>
                    <div class="col-total" id="out-total-${i}"></div>
                </div>`;
        }
        inputContainer.innerHTML = rowsHtml;
        outputContainer.innerHTML = outputHtml;

        // Establish core static elements sync links
        const staticFields = ['date', 'no', 'date-issued', 'to', 'payment'];
        staticFields.forEach(field => {
            const inp = document.getElementById(`in-${field}`);
            const out = document.getElementById(`out-${field}`);
            inp.addEventListener('input', () => out.textContent = inp.value);
            out.textContent = inp.value;
        });

        // Add execution calculation event listeners
        document.querySelectorAll('.tr-desc, .tr-subdesc, .tr-price, .tr-qty')
            .forEach(el => el.addEventListener('input', computeTotals));

        function computeTotals() {
            let runningTotal = 0;
            
            for(let i=0; i<MAX_ROWS; i++) {
                const desc = document.querySelector(`.tr-desc[data-idx="${i}"]`).value;
                const subdesc = document.querySelector(`.tr-subdesc[data-idx="${i}"]`).value;
                const price = parseFloat(document.querySelector(`.tr-price[data-idx="${i}"]`).value) || 0;
                const qty = parseFloat(document.querySelector(`.tr-qty[data-idx="${i}"]`).value) || 0;

                const lineTotal = price * qty;
                runningTotal += lineTotal;

                // Sync description nodes
                document.getElementById(`out-desc-${i}`).textContent = desc;
                document.getElementById(`out-subdesc-${i}`).textContent = subdesc;
                
                // Sync financial nodes
                document.getElementById(`out-price-${i}`).textContent = price > 0 ? price.toFixed(2) : '';
                document.getElementById(`out-qty-${i}`).textContent = qty > 0 ? qty : '';
                document.getElementById(`out-total-${i}`).textContent = lineTotal > 0 ? lineTotal.toFixed(2) : '';
            }

            const formattedTotal = `$${runningTotal.toFixed(2)}`;
            
            // MODIFICATION 2: Sub-Total calculations are skipped, directly outputting Grand Total
            document.getElementById('out-grand').textContent = runningTotal > 0 ? formattedTotal : '$0.00';
            
            document.getElementById('out-total-due').textContent = runningTotal > 0 ? formattedTotal : '$0.00';
            document.getElementById('in-total-due').value = runningTotal > 0 ? formattedTotal : '$0.00';
        }

        computeTotals();
    </script>
</body>
</html>
